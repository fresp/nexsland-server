name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o nexsland-server ./cmd/nexsland-server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nexsland-server:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test the image
        run: |
          docker run -d --name nx -p 127.0.0.1:8080:8080 \
            -e NEXSLAND_PUBLIC_URL=http://localhost:8080 -e NEXSLAND_TZ=Asia/Jakarta \
            nexsland-server:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/.well-known/oauth-authorization-server
          docker exec nx nexsland-server healthcheck
          docker logs nx
